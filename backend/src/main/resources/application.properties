spring.application.name=tupla-kupla

# Points at the Postgres container from compose.yaml (see .env.example at the repo root).
# Every value falls back to the compose defaults, so `docker compose up -d` then `./mvnw
# spring-boot:run` works with no extra environment setup.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tuplakupla}
spring.datasource.username=${POSTGRES_USER:tuplakupla}
spring.datasource.password=${POSTGRES_PASSWORD:tuplakupla}

# Flyway (see src/main/resources/db/migration) owns the schema; Hibernate only checks
# that the entities match what Flyway created, it never alters the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing key and access token lifetime. The default secret is dev-only; every
# deployment that isn't a laptop must set JWT_SECRET to its own value. Kept short-lived
# because it can't be revoked before it expires; app.refresh-token.* below is what
# actually gets revoked on logout or on reuse detection.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-please-change-me-3f8a1c9e7b2d4f6a}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# The access token travels as an httpOnly cookie so it's never reachable from JS.
# Secure must be true wherever the app isn't served over plain http (i.e. everywhere
# except local dev).
app.jwt.cookie-name=access_token
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# Refresh token cookie and lifetime. Unlike the access token this is an opaque random
# value, stored hashed in refresh_tokens, so it can be revoked on demand. Each successful
# /api/auth/refresh call rotates it (old one revoked, new one issued); presenting an
# already-revoked token revokes every active token for that user, since that only happens
# if a token was copied and used after its legitimate owner already rotated it. The cookie
# is scoped to /api/auth so it's never sent on ordinary API requests.
app.refresh-token.cookie-name=refresh_token
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}

# Origin allowed to call the API with credentials (cookies) from the browser.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
