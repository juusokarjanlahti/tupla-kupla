spring.application.name=tupla-kupla

# Points at the Postgres container from compose.yaml (see .env.example at the repo root).
# Every value falls back to the compose defaults, so `docker compose up -d` then `./mvnw
# spring-boot:run` works with no extra environment setup.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tuplakupla}
spring.datasource.username=${POSTGRES_USER:tuplakupla}
spring.datasource.password=${POSTGRES_PASSWORD:tuplakupla}

# Flyway (see src/main/resources/db/migration) owns the schema; Hibernate only checks
# that the entities match what Flyway created, it never alters the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing key and access token lifetime. The default secret is dev-only; every
# deployment that isn't a laptop must set JWT_SECRET to its own value.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-please-change-me-3f8a1c9e7b2d4f6a}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Origin allowed to call the API with credentials (cookies) from the browser.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
